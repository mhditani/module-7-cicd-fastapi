services:
  db:
    image: postgres:18
    container_name: postgres_db

    environment:
      POSTGRES_USER: pro_role
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myappdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    container_name: fastapi_app

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://pro_role:mypassword@db:5432/myappdb

    volumes:
      - .:/app

    depends_on:
      - db

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: